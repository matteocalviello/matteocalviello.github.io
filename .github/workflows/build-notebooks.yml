name: Deploy Jupyter Notebooks to HTML

on:
  push:
    branches:
      - main
    paths:
      - 'notebooks/**/*.ipynb'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert

      - name: Convert Notebooks to HTML
        run: |
          mkdir -p public/projects
          for file in notebooks/*.ipynb; do
            if [ -f "$file" ]; then
              jupyter nbconvert --to html --template classic "$file" --output-dir public/projects/
            fi
          done

      - name: Commit HTML files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/projects/*.html
          git commit -m "Auto-compile Jupyter notebooks to HTML" || echo "No changes to commit"
          git push